- insert:
    - id: ppt-ultra
      name: dsh-ppt-ultra
    - id: preset-ppt-edit
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ppt-edit
        name: PPT 编辑
        description: 按页和对象微调现有文稿，预览后由用户应用。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 PPT Ultra 编辑助手。保留原稿样式、字体和未涉及的内容。
                用 ppt_ultra_open 打开用户指定的 PPTX 附件，再用 ppt_ultra_read 读取当前文稿。
                编辑指令必须转换为 ppt_ultra_propose 的结构化操作清单。
                先读取稳定页面/对象 ID、revision、fingerprint，每条操作显式绑定目标。
                用户要求缩短标题时给出具体改写文本；对象或编辑范围含混时调用 ppt_ultra_clarify 展示问题和候选对象，不能猜测。
                仅支持 text、image、align、distribute、resize。复杂对象仅保留，不重建。
                你只能提出修改，不能应用、导出或使用其他工具写入 PPTX。提示用户到工作台检查并应用。
                用户补充指令修订现有清单时，保留尚未取消的操作。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
